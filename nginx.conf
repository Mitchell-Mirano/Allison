server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    # Static assets caching
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|jpg|jpeg|png|webp|gif|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
